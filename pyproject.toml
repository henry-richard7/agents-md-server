[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agents-md-server"
version = "0.1.0"
description = "Production-ready Model Context Protocol (MCP) server for dynamic skilldeck agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.3.1",
    "httpx>=0.28.1",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.9.0",
]

[project.scripts]
agents-md-server = "agents_md_server.cli:main"
skilldeck = "agents_md_server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_md_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
